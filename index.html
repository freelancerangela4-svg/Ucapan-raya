<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Hari Raya Aidil Adha</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
            text-align: center;
        }
        .card {
            background: rgba(0, 0, 0, 0.5);
            padding: 40px;
            border-radius: 25px;
            backdrop-filter: blur(15px);
            border: 2px solid #ffd700;
            max-width: 500px;
            z-index: 10;
        }
        .rainbow-text {
            background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 15px 30px;
            background: linear-gradient(45deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #9400d3);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="rainbow-text">Selamat Hari Raya Aidil Adha</h1>
        <p class="rainbow-text">Di kesempatan yang mulia ini, saya menyusun sepuluh jari memohon kemaafan di atas segala salah dan silap.</p>
        <p class="rainbow-text" style="font-size: 1.3rem;">Dari: Rahman Bin Aninua</p>
        
        <a href="https://wa.me/601124332722?text=Selamat%20Hari%20Raya%20Aidil%20Adha%20dari%20Rahman" class="btn" onclick="letupanBungaApi()">
            Klik di sini untuk kirim ucapan
        </a>
    </div>

    <script>
        // Fungsi untuk animasi bunga api
        function letupanBungaApi() {
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        // Animasi bunga api automatik setiap 3 saat
        setInterval(() => {
            confetti({
                particleCount: 50,
                spread: 100,
                origin: { y: Math.random() }
            });
        }, 3000);
    </script>

</body>
</html>
